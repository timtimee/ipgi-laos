<section class="hero-section jackpot-view" id="latest-jackpot">
  <div class="hero-copy reveal-card">
    <p class="eyebrow">Latest Jackpot</p>
    <h1>Jackpot Updates</h1>
    <p class="lead">Jackpot updates every 2 hours.</p>

    <div class="tab-row" role="tablist" aria-label="Jackpot mode">
      <button class="tab-btn active" type="button" data-jackpot-mode="current">Current Jackpot</button>
      <button class="tab-btn" type="button" data-jackpot-mode="last">Last Jackpot Hits</button>
    </div>
  </div>

  <div class="jackpot-grid" id="jackpotGrid">
    <div class="loading-card">Loading jackpot data...</div>
  </div>
</section>
